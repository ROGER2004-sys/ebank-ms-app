spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ebank-service
              uri: http://localhost:8083
              predicates:
                - Path=/ebank,/ebank/**
              filters:
                - RewritePath=^/ebank(?<remaining>/?.*), /api/accounts${remaining}

            - id: customer-service
              uri: http://localhost:8082
              predicates:
                - Path=/customer,/customer/**,/customers,/customers/**
              filters:
                - RewritePath=^/(?:customer|customers)(?<remaining>/?.*), /api/customers${remaining}
