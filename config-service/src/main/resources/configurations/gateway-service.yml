spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ebank-bot
              uri: http://localhost:${EBANK_BOT_PORT:8066}
              predicates:
                - Path=/ebank-bot/**
              filters:
                - StripPrefix=1
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "*"
                allowed-methods: "*"
                allowed-headers: "*"
