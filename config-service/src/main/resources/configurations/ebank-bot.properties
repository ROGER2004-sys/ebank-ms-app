server.port=${EBANK_BOT_PORT:8066}

spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=qwen/qwen3.8-27b
spring.ai.openai.chat.options.reasoning-effort=none
spring.ai.mcp.client.streamable-http.connections.customer.url=${CUSTOMER_SERVICE_URL:http://localhost:8082}
spring.ai.mcp.client.streamable-http.connections.ebank.url=${EBANK_SERVICE_URL:http://localhost:8083}

spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false
eureka.client.enabled=false
eureka.client.jersey.enabled=false

banking-services.customers-url=${GATEWAY_URL:http://localhost:9999}/customer-service/api/customers
banking-services.accounts-url=${GATEWAY_URL:http://localhost:9999}/ebank-service/api/accounts
discord.token=${DISCORD_TOKEN:}
telegram.token=${TELEGRAM_TOKEN:}
telegram.bot.username=EbankBot04
