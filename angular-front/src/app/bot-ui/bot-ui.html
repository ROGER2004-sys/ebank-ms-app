<div class="container py-4">
  <h2>Assistant IA</h2>
  <form class="d-flex gap-2" (ngSubmit)="askAgent()">
    <input
      [(ngModel)]="query"
      name="query"
      type="text"
      class="form-control"
      placeholder="Posez votre question à l'assistant IA"
      [disabled]="loadservice.isLoading()"
    >
    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="!query.trim() || loadservice.isLoading()"
    >
      Envoyer
    </button>
  </form>
  @if (loadservice.isLoading()) {
    <div class="mt-3" role="status">
      <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
      <span class="visually-hidden">Chargement...</span>
      <span class="ms-2">Le bot réfléchit...</span>
    </div>
  }

  @if (errorMessage) {
    <p class="alert alert-danger mt-3" role="alert">{{ errorMessage }}</p>
  }

  @if (response$ | async; as botResponse) {
    <div class="card mt-3">
      <div class="card-body bot-response" aria-live="polite">
        <markdown [data]="botResponse"></markdown>
      </div>
    </div>
  }
</div>
